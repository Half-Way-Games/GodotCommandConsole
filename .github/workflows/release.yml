name: Release Addon

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Addon Directory
        run: |
          # Create a zip containing only the command_console addon
          zip -r command_console.zip addons/command_console

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: command_console.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
